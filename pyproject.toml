[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "cylc-model-telemetry"
description = "Send cylc suite run telemetry to ACCESS-NRI tracking services"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "requests"
    "jsonschema",
]

[project.optional-dependencies]
test = ["pytest", "requests-mock"]

[project.scripts]
cylc-model-telemetry = "cylc_model_telemetry.cli:main"

[tool.setuptools.package-data]
cylc_model_telemetry = ["*.schema.json"]

[tool.setuptools_scm]