[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "cylc-model-telemetry"
description = "Send cylc suite run telemetry to ACCESS-NRI tracking services"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "requests",
    "jsonschema",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "requests-mock"]

[project.urls]
Repository = "https://github.com/ACCESS-NRI/cylc-model-telemetry"

[project.scripts]
cylc-model-telemetry = "cylc_model_telemetry.cli:main"

[tool.setuptools.package-data]
cylc_model_telemetry = ["*.schema.json"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cylc_model_telemetry"

[tool.coverage.run]
source = ["cylc_model_telemetry"]
